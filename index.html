<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!-- ✅ 모바일/아이폰 안전 viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>BANADA</title>

    <!-- ============================================ -->
    <!-- ✅ PWA 설정 -->
    <!-- ============================================ -->

    <!-- Favicon (브라우저 탭) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png" />

    <!-- iOS 홈화면 아이콘 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- 테마 색상 (상단 상태바) -->
    <meta name="theme-color" content="#000000" />

    <!-- iOS 웹앱 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BANADA" />

    <!-- Android 웹앱 설정 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BANADA" />

    <!-- ============================================ -->
    <!-- ✅ SEO 메타 태그 -->
    <!-- ============================================ -->
    <meta name="description" content="시간이 멈추는 곳, BANADA — 오늘 밤, 잊지 못할 만남이 시작됩니다" />
    <meta name="keywords" content="BANADA, 바나다, 프리미엄 라운지, 프라이빗 커넥션, 회원제" />
    <meta name="author" content="BANADA" />

    <!-- ============================================ -->
    <!-- ✅ Open Graph (텔레그램, 카카오, 페북) -->
    <!-- ============================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BANADA" />
    <meta property="og:title" content="BANADA" />
    <meta property="og:description" content="시간이 멈추는 곳, BANADA — 오늘 밤, 잊지 못할 만남이 시작됩니다" />
    <meta property="og:image" content="https://banadameet.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BANADA - Private Members Lounge" />
    <meta property="og:url" content="https://banadameet.com" />
    <meta property="og:locale" content="ko_KR" />

    <!-- ============================================ -->
    <!-- ✅ Twitter Card (트위터, X) -->
    <!-- ============================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BANADA" />
    <meta name="twitter:description" content="시간이 멈추는 곳, BANADA — 오늘 밤, 잊지 못할 만남이 시작됩니다" />
    <meta name="twitter:image" content="https://banadameet.com/og-image.png" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        -webkit-text-size-adjust: 100%;
      }

      body {
        overflow-x: hidden;
      }

      #root {
        width: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* ✅ iOS input 자동 줌 방지 */
      input, textarea, select {
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
